[package]
name = "nixos-flakes"
description = "CLI de gestion des flakes Nix de la machine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "nixos-flakes"
path = "src/main.rs"

[dependencies]
nixos-flakes-core = { path = "../nixos-flakes-core" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nixos-flakes-config = { path = "../nixos-flakes-config" }
tempfile = "3"
zbus = { version = "6", default-features = false, features = ["tokio"] }
ksni = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
