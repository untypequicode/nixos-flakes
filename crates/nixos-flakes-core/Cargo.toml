[package]
name = "nixos-flakes-core"
description = "Logique partagée de gestion des flakes (scan, git, mise à jour, application)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
