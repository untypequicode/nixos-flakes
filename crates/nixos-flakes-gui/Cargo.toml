[package]
name = "nixos-flakes-gui"
description = "Interface graphique de gestion des flakes Nix"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "nixos-flakes-gui"
path = "src/main.rs"

[dependencies]
nixos-flakes-core = { path = "../nixos-flakes-core" }
iced = { version = "0.14", default-features = true }
ksni = { version = "0.3", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
