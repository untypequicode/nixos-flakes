[package]
name = "nixos-flakes-gui"
description = "Interface graphique de gestion des flakes Nix"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "nixos-flakes-gui"
path = "src/main.rs"

[dependencies]
nixos-flakes-core = { path = "../nixos-flakes-core" }
nixos-flakes-config = { path = "../nixos-flakes-config" }
tempfile = "3"
iced = { version = "0.14", default-features = true, features = ["tokio"] }
iced_term = "0.8"
tokio = { version = "1", features = ["time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

