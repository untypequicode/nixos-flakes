<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="light dark" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div id="header">
            <span id="title-text">Recherche...</span>
            <span class="header-actions">
                <button id="refresh" type="button" title="Analyser à nouveau la page">
                    Actualiser
                </button>
                <button id="download-all" type="button" hidden>
                    Tout télécharger
                </button>
            </span>
        </div>
        <div id="status" role="status" aria-live="polite" hidden></div>
        <div id="notice" role="note" hidden></div>
        <div id="toolbar" hidden>
            <label>
                Trier :
                <select id="sort-select">
                    <option value="default">Ordre d'apparition</option>
                    <option value="size-desc">Plus grand d'abord</option>
                    <option value="size-asc">Plus petit d'abord</option>
                </select>
            </label>
            <label>
                Taille min (px) :
                <input type="number" id="min-size" min="0" step="10" placeholder="0" />
            </label>
        </div>
        <div id="gallery" aria-busy="true">
            <div id="loading" class="message">
                Analyse de la page en cours...
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
